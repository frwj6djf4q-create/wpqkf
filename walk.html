<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>산책할 때 듣기 좋은 노래</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
</head>

<body class="page">
  <h1 class="page-title">🚶‍♀️ 산책할 때 듣기 좋은 노래</h1>

  <main class="song-list">

    <!-- big void -->
    <div class="song-item">
      <img class="album" src="images/walk1.jpg" alt="big void 앨범 커버">
      <div class="info">
        <h2>big void</h2>
        <p>실리카겔</p>
        <a class="go-btn" target="_blank"
           href="https://www.youtube.com/results?search_query=실리카겔+big+void">
          🎧 노래 들으러 가기
        </a>
      </div>
    </div>

    <!-- 물고기 -->
    <div class="song-item">
      <img class="album" src="images/walk2.jpg" alt="물고기 앨범 커버">
      <div class="info">
        <h2>물고기</h2>
        <p>백예린</p>
        <a class="go-btn" target="_blank"
           href="https://www.youtube.com/results?search_query=백예린+물고기">
          🎧 노래 들으러 가기
        </a>
      </div>
    </div>

    <!-- wish -->
    <div class="song-item">
      <img class="album" src="images/walk3.jpg" alt="wish 앨범 커버">
      <div class="info">
        <h2>wish</h2>
        <p>오월오일</p>
        <a class="go-btn" target="_blank"
           href="https://www.youtube.com/results?search_query=오월오일+wish">
          🎧 노래 들으러 가기
        </a>
      </div>
    </div>

  </main>

  <div class="nav">
    <a href="index.html">← 메인으로</a>
  </div>

</html>
