<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이별할 때 듣기 좋은 노래</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
</head>

<body class="page page-breakup">
  <h1 class="page-title">🌧️ 이별할 때 듣기 좋은 노래</h1>

  <main class="song-list">

    <!-- 이별하러 가는 길 -->
    <div class="song-item">
      <img class="album" src="images/breakup1.jpg" alt="breakup1.jpg">
      <div class="info">
        <h2>이별하러 가는 길</h2>
        <p>임한별</p>
        <a class="go-btn" target="_blank"
           href="https://www.youtube.com/results?search_query=임한별+이별하러+가는+길">
          🎧 노래 들으러 가기
        </a>
      </div>
    </div>

    <!-- 먹구름 -->
    <div class="song-item">
      <img class="album" src="images/breakup2.jpg" alt="먹구름 앨범 커버">
      <div class="info">
        <h2>먹구름</h2>
        <p>윤하</p>
        <a class="go-btn" target="_blank"
           href="https://www.youtube.com/results?search_query=윤하+먹구름">
          🎧 노래 들으러 가기
        </a>
      </div>
    </div>

    <!-- 그녀가 말했다 -->
    <div class="song-item">
      <img class="album" src="images/breakup3.jpg" alt="그녀가 말했다 앨범 커버">
      <div class="info">
        <h2>그녀가 말했다</h2>
        <p>토이</p>
        <a class="go-btn" target="_blank"
           href="https://www.youtube.com/results?search_query=토이+그녀가+말했다">
          🎧 노래 들으러 가기
        </a>
      </div>
    </div>

  </main>

  <div class="nav">
    <a href="index.html">← 메인으로</a>
  </div>
</body>
</html>
