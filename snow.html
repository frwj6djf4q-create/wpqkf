<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>눈 올 때 듣기 좋은 노래</title>

  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  />
</head>

<body class="page">
  <h1 class="page-title">❄️ 눈 올 때 듣기 좋은 노래</h1>

  <main class="song-list">

    <!-- 하얀 그리움 -->
    <div class="song-item">
      <img class="album" src="images/snow1.jpg" alt="하얀 그리움 앨범 커버">
      <div class="info">
        <h2>하얀 그리움</h2>
        <p>프로미스나인 (fromis_9)</p>
        <a class="go-btn" target="_blank"
           href="https://www.youtube.com/results?search_query=프로미스나인+하얀+그리움">
          🎧 노래 들으러 가기
        </a>
      </div>
    </div>

    <!-- 듣는 편지 -->
    <div class="song-item">
      <img class="album" src="images/snow2.jpg" alt="듣는 편지 앨범 커버">
      <div class="info">
        <h2>듣는 편지</h2>
        <p>40</p>
        <a class="go-btn" target="_blank"
           href="https://www.youtube.com/results?search_query=40+듣는+편지">
          🎧 노래 들으러 가기
        </a>
      </div>
    </div>

    <!-- 회전목마 -->
    <div class="song-item">
      <img class="album" src="images/snow3.jpg" alt="회전목마 앨범 커버">
      <div class="info">
        <h2>회전목마</h2>
        <p>소코도모</p>
        <a class="go-btn" target="_blank"
           href="https://www.youtube.com/results?search_query=소코도모+회전목마+쇼미더머니">
          🎧 노래 들으러 가기
        </a>
      </div>
    </div>

  </main>

  <div class="nav">
    <a href="index.html">← 메인으로</a>
  </div>
</body>
</html>
